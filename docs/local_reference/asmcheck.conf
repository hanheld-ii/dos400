[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[cpu]
cputype=pentium_iii
cycles=407000

[mixer]
nosound=true

[midi]
mpu401=none

[sblaster]
sbtype=none

[gus]
gus=false

[speaker]
pcspeaker=false
tandy=off
cms=off
disney=false

[render]
frameskip=0
aspect=false

[dos]
xms=true
ems=true
umb=true

[autoexec]
mount c .
c:
cd src\tools
set PATH=c:\src\tools
set LIB=c:\src\tools\bld\lib
set INCLUDE=c:\src\tools\bld\inc
cd c:\src\cmd\format
masm /nologo /I..\..\inc /I..\..\h msfor.asm,msfor.obj,nul,masmlog.txt > masmout.txt 2>&1
echo MASM_EXIT=%ERRORLEVEL%>> masmout.txt
type masmlog.txt >> masmout.txt
exit
